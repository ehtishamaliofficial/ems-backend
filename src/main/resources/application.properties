# =============================================================================
# EMS — Application Configuration
# =============================================================================

spring.application.name=ems

# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------
server.port=8080

# -----------------------------------------------------------------------------
# PostgreSQL DataSource
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/EMS
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP — Spring Boot default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=EMS-HikariPool

## -----------------------------------------------------------------------------
## JDBC Schema Initialization
## -----------------------------------------------------------------------------
#spring.sql.init.mode=always
#spring.sql.init.schema-locations=classpath:schema.sql
#spring.sql.init.data-locations=classpath:data.sql
#spring.sql.init.continue-on-error=true

# -----------------------------------------------------------------------------
# JWT Configuration
# -----------------------------------------------------------------------------
app.jwt.secret=c4f8a2e6b9d1f3a5c7e9b2d4f6a8c0e2d4f6a8b0c2e4f6a8d0b2c4e6f8a0b2
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# -----------------------------------------------------------------------------
# 2FA Configuration
# -----------------------------------------------------------------------------
app.2fa.issuer=NADRA-EMS

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.nadra.ems=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.springframework.web=INFO

# Log file output (JSON logs picked up by Grafana/Loki/Promtail)
logging.file.name=logs/ems.log
logging.file.max-size=50MB
logging.file.max-history=30
